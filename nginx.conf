# nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html ne doit jamais être mis en cache (sinon les nouvelles versions n'arrivent pas)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fichiers JS/CSS générés par Angular : nom avec hash, cache permanent
  location ~* "\.[0-9a-f]{16,}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Images, vidéos, polices : noms sans hash, cache 7 jours
  location ~* \.(png|jpe?g|gif|webp|svg|ico|mp4|webm|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/vnd.ms-fontobject font/ttf;
}
