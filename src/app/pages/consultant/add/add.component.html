<app-dialog-header
  [title]="dialogTitle"
  icon="person_outline"
  (close)="matDialogRef.close()">
</app-dialog-header>

<div class="p-3 md:p-4">

  <!-- Avatar -->
  <div class="flex justify-center mb-3">
    <div class="relative inline-block">
      <div class="w-20 h-20 rounded-full overflow-hidden bg-gray-100 ring-2 ring-[#245363]/20">
        <img
          [src]="imageToff ? imageToff : 'assets/images/users/user-dummy-img.jpg'"
          class="w-full h-full object-cover cursor-pointer"
          (click)="openImageModal()" />
      </div>
      <label for="member-image-input"
        class="absolute bottom-0 right-0 w-6 h-6 bg-white border border-gray-200 rounded-full flex items-center justify-center cursor-pointer shadow-sm hover:bg-gray-50 transition-colors">
        <i class="bx bxs-image-alt text-xs text-gray-500"></i>
      </label>
      <input class="hidden" id="member-image-input" type="file" accept="image/png,image/gif,image/jpeg"
        (change)="selectOnFile($event,'photo_profile','Thumbnail')">
      @if (uploadedImage) {
        <button type="button"
          class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center shadow-sm hover:bg-red-600 transition-colors"
          (click)="deleteImage()">
          <i class="bx bx-trash text-white" style="font-size: 10px;"></i>
        </button>
      }
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="initForm" class="w-full">

    <!-- Nom & Prénom -->
    <div class="flex gap-2">
      <mat-form-field class="w-1/2" appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput type="text" formControlName="lastname" />
        <mat-icon matSuffix class="secondary-text">person</mat-icon>
        <mat-error>Champ obligatoire</mat-error>
      </mat-form-field>
      <mat-form-field class="w-1/2" appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput type="text" formControlName="firstname" />
        <mat-icon matSuffix class="secondary-text">person</mat-icon>
        <mat-error>Champ obligatoire</mat-error>
      </mat-form-field>
    </div>

    <!-- Email & Adresse -->
    <div class="flex gap-2">
      <mat-form-field class="w-1/2" appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
        <mat-icon matSuffix class="secondary-text">email</mat-icon>
        <mat-error>Champ obligatoire</mat-error>
      </mat-form-field>
      <mat-form-field class="w-1/2" appearance="outline">
        <mat-label>Adresse</mat-label>
        <input matInput type="text" formControlName="locality" />
        <mat-icon matSuffix class="secondary-text">home</mat-icon>
        <mat-error>Champ obligatoire</mat-error>
      </mat-form-field>
    </div>

    <!-- Fonction -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>Fonction</mat-label>
      <mat-select formControlName="fonction_id">
        <mat-option *ngFor="let role of roles" [value]="role.id">
          {{ role.libelle }}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix class="secondary-text">work</mat-icon>
      <mat-error>Champ obligatoire</mat-error>
    </mat-form-field>

    <!-- Organe représenté -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>Organe représenté</mat-label>
      <mat-select formControlName="partieInteresse_id">
        <mat-option *ngFor="let organe of organes" [value]="organe.id">
          {{ organe.libelle }}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix class="secondary-text">account_balance</mat-icon>
      <mat-error>Champ obligatoire</mat-error>
    </mat-form-field>

    <!-- Téléphone -->
    <mat-form-field class="w-full telephone" appearance="outline">
      <ngx-mat-intl-tel-input
        [preferredCountries]="['sn', 'fr']"
        [enablePlaceholder]="true"
        [enableSearch]="true"
        formControlName="contact">
      </ngx-mat-intl-tel-input>
      <mat-icon matSuffix class="secondary-text">phone</mat-icon>
      <mat-error>Champ obligatoire</mat-error>
    </mat-form-field>

    <!-- Actions -->
    <div class="flex justify-end gap-2 mt-2">
      <button mat-stroked-button type="button" (click)="matDialogRef.close()">
        Annuler
      </button>
      <button mat-raised-button color="primary" [disabled]="loader" (click)="checkRecap(action)">
        {{ labelButton }}
      </button>
    </div>

  </form>

  <app-loader-data *ngIf="loader"></app-loader-data>
</div>
