<div class="container-fluid">

  <app-page-actions
    title="Normes du projet"
    icon="bx-book-open"
    [breadcrumbItems]="breadCrumbItems"
    searchPlaceholder="Rechercher une norme..."
    [actions]="pageActions"
    (onSearch)="filterTable($event)"
    (onAction)="handleAction($event)">
  </app-page-actions>

  <app-loader-custom *ngIf="isLoading"></app-loader-custom>

  <div style="z-index: 0" class="pt-3">
    <tableau
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      [pageSize]="pageSize"
      [total]="length"
      [coleurEntete]="headers"
      [entete]="headers"
      [data]="filteredNormes"
      [actions]="btnActions"
      (changePage)="pageChanged($event)"
      *ngIf="!isLoading">
    </tableau>
  </div>

</div>

<!-- ==================== Modal Ajout / Édition ==================== -->
<div bsModal #normeModal="bs-modal" class="modal fade" tabindex="-1"
     [config]="{ backdrop: 'static', keyboard: false }">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content overflow-hidden">

      <app-dialog-header
        [title]="isEditing ? 'Modifier la norme' : 'Ajouter une norme'"
        icon="menu_book"
        (close)="normeModal.hide()">
      </app-dialog-header>

      <div class="p-4">
        <form [formGroup]="normeForm">

          <mat-form-field class="w-full" appearance="outline">
            <mat-label>Titre</mat-label>
            <input matInput formControlName="titre"
              placeholder="Ex: NES 5, IFC PS 5, Décret n°2011-..." />
            <mat-icon matSuffix>title</mat-icon>
            <mat-error *ngIf="f['titre'].errors?.['required']">Le titre est obligatoire.</mat-error>
            <mat-error *ngIf="f['titre'].errors?.['minlength']">Minimum 2 caractères.</mat-error>
          </mat-form-field>

          <mat-form-field class="w-full mt-2" appearance="outline">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="4"
              placeholder="Décrivez le contenu ou l'exigence de cette norme..."></textarea>
            <mat-error *ngIf="f['description'].errors?.['required']">La description est obligatoire.</mat-error>
          </mat-form-field>

        </form>
      </div>

      <div class="flex justify-end gap-2 px-4 pb-4">
        <button mat-stroked-button type="button" (click)="normeModal.hide()">Annuler</button>
        <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="isSaving">
          <mat-spinner *ngIf="isSaving" diameter="16" class="me-1 d-inline-block"></mat-spinner>
          {{ isEditing ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ==================== Modal Détail ==================== -->
<div bsModal #detailModal="bs-modal" class="modal fade" tabindex="-1"
     [config]="{ backdrop: true, keyboard: true }">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content overflow-hidden" *ngIf="selectedNorme">

      <app-dialog-header
        title="Détail de la norme"
        icon="info"
        (close)="detailModal.hide()">
      </app-dialog-header>

      <div class="p-4">

        <div class="mb-4">
          <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Titre</p>
          <p class="text-sm font-semibold text-gray-800">{{ selectedNorme.titre }}</p>
        </div>

        <mat-divider></mat-divider>

        <div class="mt-4">
          <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Description</p>
          <p class="text-sm text-gray-700 whitespace-pre-line leading-relaxed">{{ selectedNorme.description }}</p>
        </div>

      </div>

      <div class="flex justify-end gap-2 px-4 pb-4">
        <button mat-stroked-button type="button" (click)="openEditModal(selectedNorme); detailModal.hide()">
          <mat-icon class="!text-base me-1">edit</mat-icon>
          Modifier
        </button>
        <button mat-raised-button color="primary" type="button" (click)="detailModal.hide()">Fermer</button>
      </div>

    </div>
  </div>
</div>
