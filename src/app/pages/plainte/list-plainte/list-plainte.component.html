<div>
  <app-page-title title="Liste des plaintes" [breadcrumbItems]="breadCrumbItems"></app-page-title>
</div>

<div class="d-flex flex-row justify-between row mb-2">
  <div class="col-sm">
    <div class="search-box me-2 d-inline-block">
      <div class="position-relative">
        <input type="text" class="form-control" autocomplete="off" placeholder="Rechercher..."
          (input)="filterTable($event)">
        <i class="bx bx-search-alt search-icon"></i>
      </div>
    </div>
  </div>
  <div class="d-flex flex-row col-sm-auto">
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn bgPrimaire" (click)="triggerFileUpload()">
        <i class="mdi mdi-file-excel me-1"></i> Importer Excel
      </button>
      <button type="button" class="btn bgPrimaire" (click)="addItems()">
        <i class="mdi mdi-plus me-1"></i> Enregistrer une plainte
      </button>
    </div>
  </div>
  <input type="file" id="file-upload" (change)="fileUpload($event)" accept=".xls,.xlsx" style="display: none;">
</div>

@if (dataExcel.length > 0) {
  <div class="card p-3 mb-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-muted fw-bold">Aperçu : {{ dataExcel.length }} ligne(s) à importer</span>
    </div>
    <app-plainte-preview [dataExcel]="dataExcel"></app-plainte-preview>
    <div class="text-end mt-2">
      <button type="button" class="btn btn-danger me-2" (click)="resetDataFromExcel()">Annuler</button>
      <button type="button" class="btn btn-success" (click)="importData()">Confirmer l'import</button>
    </div>
  </div>
}

<app-loader-custom *ngIf="loadData"></app-loader-custom>

<div style="z-index: 0" class="pt-3">
  <tableau
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    [pageSize]="pageSize"
    [total]="length"
    [entete]="headers"
    [coleurEntete]="headers"
    [data]="datas"
    [actions]="btnActions"
    (changePage)="pageChanged($event)">

    <!-- Badge Statut -->
    <ng-template #statut let-item>
      <span [ngClass]="{
        'badge bg-success': item.statut === 'FERMEE',
        'badge bg-warning text-dark': item.statut === 'EN COURS',
        'badge bg-primary': item.statut === 'OUVERTE'
      }">{{ item.statut }}</span>
    </ng-template>

    <!-- Badge Niveau de gravité -->
    <ng-template #niveauGravite let-item>
      <span [ngClass]="{
        'badge bg-danger':  ['Elevé','ELEVE','Eléve'].includes(item.niveauGravite),
        'badge bg-warning text-dark': item.niveauGravite === 'Moyen',
        'badge bg-success': item.niveauGravite === 'Faible'
      }">{{ item.niveauGravite }}</span>
    </ng-template>

  </tableau>
</div>
