<app-dialog-header
  [title]="dialogTitle"
  icon="description"
  (close)="matDialogRef.close()">
</app-dialog-header>

<div class="p-3 md:p-4">

  <!-- Sous-titre -->
  <p class="text-center text-sm font-semibold text-[#245363] mb-3">PV de la rencontre</p>

  <!-- Avatar document -->
  <div class="flex justify-center mb-3">
    <div class="relative inline-block">
      <div class="w-20 h-20 rounded-full overflow-hidden bg-gray-100 ring-2 ring-[#245363]/20">
        <img
          [src]="imageToff ? imageToff : 'assets/images/documents-icon.jpg'"
          class="w-full h-full object-cover cursor-pointer"
          (click)="openImageModal()" />
      </div>
      <label for="document-image-input"
        class="absolute bottom-0 right-0 w-6 h-6 bg-white border border-gray-200 rounded-full flex items-center justify-center cursor-pointer shadow-sm hover:bg-gray-50 transition-colors">
        <i class="bx bxs-image-alt text-xs text-gray-500"></i>
      </label>
      <input class="hidden" id="document-image-input" type="file"
        accept="image/png,image/jpg,image/jpeg,.pdf,.doc,.docx,.docm"
        (change)="selectOnFile($event)">
      <button *ngIf="uploadedImage" type="button"
        class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center shadow-sm hover:bg-red-600 transition-colors"
        (click)="deleteImage()">
        <i class="bx bx-trash text-white" style="font-size: 10px;"></i>
      </button>
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="initForm" class="w-full">

    <!-- Libellé -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>Libellé</mat-label>
      <input matInput type="text" formControlName="libelle" />
      <mat-icon matSuffix class="secondary-text">label</mat-icon>
      <mat-error>Champ obligatoire</mat-error>
    </mat-form-field>

    <!-- Date -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>Date de la rencontre</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" placeholder="Choisir une date" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error>Champ obligatoire</mat-error>
    </mat-form-field>

    <!-- Actions -->
    <div class="flex justify-end gap-2 mt-2">
      <button mat-stroked-button type="button" (click)="matDialogRef.close()">
        Annuler
      </button>
      <button mat-raised-button color="primary" [disabled]="loader" (click)="checkRecap(action)">
        {{ labelButton }}
      </button>
    </div>

  </form>

  <app-loader-data *ngIf="loader"></app-loader-data>
</div>
