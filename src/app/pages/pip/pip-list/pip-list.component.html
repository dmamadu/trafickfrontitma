<div class="container-fluid">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Nos parties intéressées</h3>

    <button class="btn bgPrimaire" (click)="addItems()">
      + Ajouter
    </button>
  </div>

  <!-- A → Z -->
  <div class="alphabet-bar">
    <span
      *ngFor="let letter of alphabet"
      (click)="scrollTo(letter)"
      class="alphabet-btn"
    >
      {{ letter }}
    </span>
  </div>

  <!-- LOADER -->
  <div *ngIf="loadData" class="text-center mt-4">
    Chargement en cours...
  </div>

  <!-- LISTE -->
  <div *ngFor="let letter of alphabet">

    <div *ngIf="groupedData[letter]?.length">

      <!-- LETTRE -->
      <div [id]="letter" class="letter-title">
        {{ letter }}
      </div>

      <!-- COLONNES -->
      <div class="list-grid">

        <div
          *ngFor="let item of groupedData[letter]"
          class="list-item"
          (click)="openDetailModal(item)"
        >
          {{ item.libelle }}
        </div>

      </div>

    </div>

  </div>

</div>
