<app-page-actions
  title="Liste des Pap habitats affectés par le projet"
  [breadcrumbItems]="breadCrumbItems"
  searchPlaceholder="Rechercher un PAP habitat..."
  [showSearch]="true"
  [actions]="actions"
  (onSearch)="filterTable($event)"
  (onAction)="handleAction($event)">
</app-page-actions>

<input type="file" id="file-upload" (change)="fileUpload($event)" name="fileUpload" accept=".xls,.xlsx" style="display:none">

<!-- PREVIEW EXCEL -->
@if (dataExcel.length > 0) {
  <div class="excel-preview">
    <app-datatable [headings]="headings" [dataExcel]="dataExcel" #dataTable></app-datatable>
    <div class="excel-actions">
      @if (dataTable.hasErrors()) {
        <span class="error-hint">Veuillez corriger les erreurs avant d'importer</span>
      }
      <button class="btn-cancel" (click)="resetDataFromExcel()">Annuler</button>
      <button class="btn-confirm"
        [disabled]="dataTable.hasErrors()"
        [class.disabled]="dataTable.hasErrors()"
        (click)="importData()">Importer</button>
    </div>
  </div>
}

<!-- LOADER -->
<app-loader-data *ngIf="loadData"></app-loader-data>

<!-- TABLEAU -->
<div class="table-wrap" *ngIf="!loadData">
  <tableau
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    [pageSize]="pageSize"
    [total]="length"
    [coleurEntete]="headers"
    [entete]="headers"
    [data]="datas"
    [actions]="btnActions"
    [enableSelection]="true"
    [enableBulkDelete]="true"
    (bulkDelete)="handleBulkDelete($event)"
    (changePage)="pageChanged($event)">
  </tableau>
</div>
