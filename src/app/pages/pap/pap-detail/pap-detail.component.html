<div class="page-wrapper">

  <!-- ===== HEADER COMPACT ===== -->
  <div class="page-header">
    <!-- Avatar -->
    <div class="avatar-wrap" matTooltip="Charger l'image du client" (click)="photoP.click()">
      <img class="avatar-img" [src]="imagePath || noImage" alt="Photo client" />
      <div class="avatar-overlay"><i class="bx bx-camera"></i></div>
      <mat-progress-spinner *ngIf="loaderImg" class="avatar-spinner" [mode]="'indeterminate'" [strokeWidth]="3" [diameter]="24"></mat-progress-spinner>
      <input hidden #photoP (change)="selectOnFile($event,'photo_profile','Thumbnail')" type="file" accept="image/png,image/jpg,image/jpeg,.pdf,.doc,.docx,.docm" />
    </div>

    <!-- Infos client -->
    <div class="header-meta">
      <div class="meta-item">
        <span class="meta-label">Id Pap</span>
        <span class="meta-value">{{infosPap?.idPap}}</span>
      </div>
      <div class="sep"></div>
      <div class="meta-item">
        <span class="meta-label">N° Identification</span>
        <span class="meta-value">{{infosPap?.numeroIdentification}}</span>
      </div>
      <div class="sep"></div>
      <button class="icon-btn" (click)="signatureClient()" matTooltip="Voir signature">
        <i class="bx bx-pencil"></i>
      </button>
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button class="btn-action" (click)="changeClient('dedommage', infosPap.id)" matTooltip="Dédommager client">
        <i class="bx bx-user-check"></i>
        <span>Dédommager</span>
      </button>
      <button class="btn-action" (click)="triggerFileUpload()">
        <i class="bx bx-upload"></i>
        <span>Importer</span>
      </button>
      <button class="btn-action" (click)="addItems()">
        <i class="bx bx-plus"></i>
        <span>Formuler</span>
      </button>
      <input type="file" id="file-upload" (change)="fileUpload($event)" name="fileUpload" accept=".xls,.xlsx" style="display:none" />
      <mat-progress-spinner *ngIf="loader" [mode]="'indeterminate'" [strokeWidth]="3" [diameter]="20"></mat-progress-spinner>
    </div>
  </div>

  <!-- ===== IMPORT EXCEL PREVIEW ===== -->
  @if (dataExcel.length > 0) {
    <div class="excel-preview">
      <app-datatable [headings]="headings" [dataExcel]="dataExcel"></app-datatable>
      <div class="excel-actions">
        <button class="btn-cancel" (click)="resetDataFromExcel()">Annuler</button>
        <button class="btn-confirm" (click)="importData()">Ajouter</button>
      </div>
    </div>
  }

  <!-- ===== LAYOUT DRAWER ===== -->
  <mat-drawer-container class="drawer-container" autosize>

    <!-- Sidebar -->
    <mat-drawer class="sidebar" [autoFocus]="false" [mode]="'side'" [opened]="true" #drawer>
      <nav class="sidebar-nav">
        <ng-container *ngFor="let item of menuData">
          <p class="nav-group-label">{{item?.title}}</p>
          <button
            *ngFor="let child of item?.children"
            class="nav-item"
            [disabled]="(child.id =='bureau' || child.id == 'audit' || child.id =='wallet' || child.id == 'decouvert') || (infosPap?.statut ==='DEMISSION' ? child.id == 'transfert' : '') || (infosPap?.statut ==='DEMISSION' ? child.id == 'demande' : '')"
            (click)="goToPanel(child.id)"
            [class.nav-item--active]="selectedPanel === child.id"
            [class.nav-item--disabled]="(child.id =='bureau' || child.id == 'audit' || child.id =='wallet' || child.id == 'decouvert')">
            <i class="bx {{child?.icon}}"></i>
            <span>{{child?.title}}</span>
            <span *ngIf="selectedPanel === child.id" class="nav-dot"></span>
          </button>
        </ng-container>
      </nav>
    </mat-drawer>

    <!-- Content -->
    <mat-drawer-content class="drawer-content">
      <button class="menu-toggle lg:hidden" (click)="drawer.toggle()">
        <i class="bx bx-menu"></i>
      </button>

      <div class="panel-content">
        <div [ngSwitch]="selectedPanel">
          <div *ngSwitchCase="'info-client'">
            <info-client [infosPap]="infosPap"></info-client>
          </div>
          <div *ngSwitchCase="'plainte'">
            <tableau [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize"
              [total]="length" [coleurEntete]="headers" [entete]="headers" [data]="datas" [actions]="btnActions"
              (changePage)="pageChanged($event)"></tableau>
          </div>
          <div *ngSwitchCase="'entente'">
            <tableau [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize"
              [total]="length" [coleurEntete]="headers" [entete]="headers" [data]="datas" [actions]="btnActions"
              (changePage)="pageChanged($event)"></tableau>
          </div>
        </div>
      </div>
    </mat-drawer-content>

  </mat-drawer-container>
</div>
