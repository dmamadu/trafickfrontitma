<app-dialog-header [title]="dialogTitle" icon="work_outline" (close)="matDialogRef.close()"></app-dialog-header>

<form [formGroup]="initForm" class="inv-dialog-form" (ngSubmit)="checkRecap(action)">
  <div class="inv-dialog-body">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Libellé de la fonction</mat-label>
      <input matInput type="text" name="libelle" formControlName="libelle" cdkFocusInitial />
      <mat-icon matSuffix>work_outline</mat-icon>
      <mat-error>Ce champ est obligatoire.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Niveau de privilège</mat-label>
      <mat-select formControlName="categorieId">
        <mat-option *ngFor="let categorie of categories" [value]="categorie.id">
          {{ categorie.libelle }}
        </mat-option>
      </mat-select>
      <mat-error>Ce champ est obligatoire.</mat-error>
    </mat-form-field>
  </div>

  <div class="inv-dialog-footer">
    <button type="button" class="inv-btn inv-btn--outline" (click)="matDialogRef.close()">Annuler</button>
    <button type="submit" class="inv-btn inv-btn--primary" [disabled]="loader || initForm.invalid">
      {{ labelButton.trim() }}
    </button>
  </div>
</form>
