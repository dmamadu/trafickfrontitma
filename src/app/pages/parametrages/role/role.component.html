<header class="inv-page-header">
  <div>
    <h1 class="inv-page-header__title">Rôles</h1>
    <p class="inv-page-header__subtitle">Définissez les rôles et les permissions accordées à chacun.</p>
  </div>
  <div class="inv-page-header__actions">
    <button type="button" class="inv-btn inv-btn--primary" (click)="addItems()">
      <i class="bx bx-plus"></i> Créer un rôle
    </button>
  </div>
</header>

<app-loader-custom *ngIf="loadData"></app-loader-custom>

<tableau [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" [total]="length"
  [coleurEntete]="headers" [entete]="headers" [data]="datas" [actions]="btnActions"
  (changePage)="pageChanged($event)" *ngIf="!loadData"></tableau>
