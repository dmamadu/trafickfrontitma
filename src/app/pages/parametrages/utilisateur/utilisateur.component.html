<header class="inv-page-header">
  <div>
    <h1 class="inv-page-header__title">Utilisateurs</h1>
    <p class="inv-page-header__subtitle">Comptes ayant accès à la plateforme, leurs rôles et leur statut.</p>
  </div>
  <div class="inv-page-header__actions">
    <button *appHasPermission="'UTILISATEURS_CREER'" type="button" class="inv-btn inv-btn--primary" (click)="addItems()">
      <i class="bx bx-plus"></i> Ajouter un utilisateur
    </button>
  </div>
</header>

<div class="inv-toolbar">
  <div class="search-box">
    <div class="position-relative">
      <input type="text" class="form-control" autocomplete="off" id="searchTableList" placeholder="Rechercher un utilisateur…"
        aria-label="Rechercher un utilisateur" (input)="filterTable($event)">
      <i class="bx bx-search-alt search-icon"></i>
    </div>
  </div>
</div>

<app-loader-custom *ngIf="loadData"></app-loader-custom>

<tableau [pageIndex]="pageIndex" [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" [total]="length"
  [coleurEntete]="headers" [entete]="headers" [data]="datas" [actions]="btnActions"
  (changePage)="pageChanged($event)" *ngIf="!loadData"></tableau>
