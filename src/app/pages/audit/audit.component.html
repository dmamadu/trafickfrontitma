<header class="inv-page-header">
  <div>
    <h1 class="inv-page-header__title">Journal d'audit</h1>
    <p class="inv-page-header__subtitle">Historique des actions sensibles : connexions, comptes, suppressions et modifications de PAP.</p>
  </div>
</header>

<form class="inv-toolbar" (ngSubmit)="applyFilters()">
  <div class="search-box">
    <div class="position-relative">
      <input type="text" class="form-control" name="utilisateurFiltre" placeholder="Filtrer par utilisateur…"
        aria-label="Filtrer par utilisateur" [(ngModel)]="utilisateurFiltre" />
      <i class="bx bx-user search-icon"></i>
    </div>
  </div>
  <select class="form-select inv-select" name="typeActionFiltre" aria-label="Type d'action"
    [(ngModel)]="typeActionFiltre" (change)="applyFilters()">
    <option value="">Tous les types d'action</option>
    <option *ngFor="let type of typeActions" [value]="type">{{ libelleType(type) }}</option>
  </select>
  <button type="submit" class="inv-btn inv-btn--primary">
    <i class="bx bx-filter-alt"></i> Filtrer
  </button>
</form>

<app-loader-custom *ngIf="loadData"></app-loader-custom>

<tableau
  [pageIndex]="pageIndex"
  [pageSizeOptions]="pageSizeOptions"
  [pageSize]="pageSize"
  [total]="length"
  [entete]="headers"
  [coleurEntete]="headers"
  [data]="datas"
  (changePage)="pageChanged($event)">
</tableau>
